name: work-graph-publish
on:
  push:
    branches: [astra/work-graph-foundation]
    paths: [.github/workflows/work-graph-publish.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TREE: 18502a076f33db32955d4bdbffc2db115a682771
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct the exact source and recovery test correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = [''.join(Path(f'.github/work-graph-transfer/part-{i}.txt').read_text().split()) for i in range(5)]
          # One known transcription typo; exact compressed and Git-tree digests still bind.
          if len(parts[2]) == 8000 and parts[2][5021] == 'n':
              parts[2] = parts[2][:5021] + 'N' + parts[2][5022:]
          out = Path(os.environ['RUNNER_TEMP']) / 'graph-evidence'
          encoded = ''.join(parts)
          (out / 'received.b64').write_text(encoded)
          packed = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(packed).hexdigest()
          assert digest == '65ab22e4a495d5e17a0f74007463d0e94ca6bedcff4ad3092e2728e2229fe098', digest
          (out / 'candidate.patch').write_bytes(lzma.decompress(packed))
          correction = Path('.github/work-graph-transfer/recovery-consent.patch').read_bytes()
          assert hashlib.sha256(correction).hexdigest() == '34f054a6b37a2da7596d8922bda2155b5a9b13e7701a429b3df1746d17136419'
          (out / 'recovery-consent.patch').write_bytes(correction)
          PY
          git worktree add --detach "$RUNNER_TEMP/graph-candidate" fd4a10245c21dbabecc3c919da5f0fbb38bcb3bf
          cd "$RUNNER_TEMP/graph-candidate"
          git apply --index --unidiff-zero "$RUNNER_TEMP/graph-evidence/candidate.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/graph-evidence/recovery-consent.patch"
          python build.py
          git add index.html
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git write-tree > "$RUNNER_TEMP/graph-evidence/TREE"
          git diff --cached --stat > "$RUNNER_TEMP/graph-evidence/CHANGE-STAT.txt"
      - name: Install the repository-owned browser QA runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/graph-candidate/requirements-dev.txt"
          python -m playwright install --with-deps chromium
      - name: Run the full unchanged-in-strength repository gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/graph-candidate"
          GRAPH_QA_OUTPUT="$RUNNER_TEMP/graph-evidence" python scripts/qa.py 2>&1 | tee "$RUNNER_TEMP/graph-evidence/qa.log"
      - name: Publish only the verified feature tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/graph-candidate"
          # Existing QA writes these six tracked artifacts. Preserve its measurements;
          # restore only these outputs, then refuse any other source drift.
          cp tests/performance-results.json "$RUNNER_TEMP/graph-evidence/performance-results.json"
          git diff --binary > "$RUNNER_TEMP/graph-evidence/qa-generated-artifacts.patch"
          git restore -- tests/beta17-read-write.png tests/beta18-inline-wire.png tests/file-menu.png tests/saved-test.sov tests/saved-test.sovpak tests/performance-results.json
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Work Graph build verification'
          git config user.email 'work-graph-verification@users.noreply.github.com'
          commit=$(printf '%s\n' 'feat: inspect source-bound workstation graphs in the native schematic editor' '' 'Verified exact candidate tree through the full repository QA gate. Temporary transfer artifacts are absent from this tree. No main/dev merge or workstation installation.' | git commit-tree "$EXPECTED_TREE" -p "$GITHUB_SHA")
          git push origin "$commit:refs/heads/astra/work-graph-foundation"
          printf '%s\n' "$commit" > "$RUNNER_TEMP/graph-evidence/COMMIT"
          git archive --format=tar "$commit" > "$RUNNER_TEMP/graph-evidence/source.tar"
          cp index.html examples/workstation-review.sovpak "$RUNNER_TEMP/graph-evidence/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-graph-candidate-evidence
          path: ${{ runner.temp }}/graph-evidence/
          retention-days: 7
