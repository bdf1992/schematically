name: settle-beta24
on:
  push:
    branches: [rc/0.1.0-rc1]
    paths:
      - '.github/workflows/settlement-payload-probe.yml'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebase and import exact Beta.24 tree
        shell: bash
        run: |
          set -euo pipefail
          archive='soveraeign-symbol-lab-beta-0.1.24.zip'
          expected='42af8e6f14b7fa18004fda89a595e7ad6bf0c553af645bc4f3ae93f65e7589a4'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main

          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"

          import_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$import_dir"
          source_root="$import_dir/soveraeign-symbol-lab-beta-0.1.24"
          test -f "$source_root/scripts/qa.py"
          test -f "$source_root/.github/workflows/ci.yml"

          git rm -r .beta24 .github/workflows/settlement-payload-probe.yml
          cp -a "$source_root/." .

          while IFS= read -r -d '' source_file; do
            relative="${source_file#"$source_root/"}"
            cmp -s "$source_file" "$relative"
          done < <(find "$source_root" -type f -print0)

          git add -A
          git diff --cached --check
          git commit -m 'chore(rc): import exact Beta.24 release candidate'
          git push --force-with-lease=refs/heads/rc/0.1.0-rc1:"$GITHUB_SHA" \
            origin HEAD:refs/heads/rc/0.1.0-rc1
