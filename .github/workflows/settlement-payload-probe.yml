name: settlement-payload-probe
on:
  push:
    branches: ['rc/0.1.0-rc1']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staged payload
        shell: bash
        run: |
          set -euxo pipefail
          cat .beta24/payload-*.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.xz
          xz -t /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload.raw
          file /tmp/payload.raw
          wc -c /tmp/payload.raw
          python - <<'PY'
          import tarfile, zipfile
          p='/tmp/payload.raw'
          if zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip(); print('ZIP',len(z.namelist()),'bad=',bad); print('\n'.join(z.namelist()[:20]))
                  assert bad is None
          elif tarfile.is_tarfile(p):
              with tarfile.open(p) as t:
                  names=t.getnames(); print('TAR',len(names)); print('\n'.join(names[:20]))
          else:
              raise SystemExit('payload is neither zip nor tar')
          PY
