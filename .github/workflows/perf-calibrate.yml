# Temporary (PR #176): samples the grow.sov / reference ratio on several hosted runners. Removed before merge.
name: perf-calibrate
on:
  push:
    branches: [feature/perf-limit-holds-on-ci]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --version
          grep -m1 'model name' /proc/cpuinfo
          for i in 1 2; do python tests/state_space_perf_qa.py | grep -E 'bench.sov:|grow.sov|PASS' || true; done
