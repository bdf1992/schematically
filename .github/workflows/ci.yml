name: schematic-ci
on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref replaces the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

env:
  PYTHONUTF8: "1"
  PIP_CACHE_DIR: ${{ github.workspace }}/.ci-pip-cache
  CARGO_HOME: ${{ github.workspace }}/.ci-cargo
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-browsers

jobs:
  verify:
    runs-on: [self-hosted, ws-arch-cut, Windows]
    # scripts/qa.py took 14 to 18 minutes on 2026-10-04 and grows with every suite added.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact committed source bytes
        run: |
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare checkout-local Python and owned launcher
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:GITHUB_WORKSPACE '.ci-venv/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $launcher = Get-Command pwsh -ErrorAction SilentlyContinue
          if ($launcher) { $launcherPath = $launcher.Source } else { $launcherPath = Join-Path $env:USERPROFILE '.cache/codex-runtimes/codex-primary-runtime/dependencies/native/powershell/pwsh.exe' }
          if (!(Test-Path -LiteralPath $launcherPath)) { throw 'PowerShell 7 is required for owned native processes' }
          & $launcherPath -NoProfile -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { exit 1 }'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 admission failed' }
          (Split-Path -Parent $launcherPath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the pinned Linux QA image
        run: |
          $image = python -c "import runpy; from pathlib import Path; m=runpy.run_path('scripts/qa_linux.py'); print(m['IMAGE']+':'+m['image_tag'](Path.cwd()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pin = python -c "import runpy; from pathlib import Path; m=runpy.run_path('scripts/qa_linux.py'); print(m['playwright_pin'](Path.cwd()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker image inspect $image | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $contextPath = Join-Path $env:GITHUB_WORKSPACE '.arch-test-evidence/image-context'
            New-Item -ItemType Directory -Force $contextPath | Out-Null
            Copy-Item -LiteralPath scripts/qa_linux.Dockerfile -Destination (Join-Path $contextPath 'Dockerfile')
            Copy-Item -LiteralPath requirements-dev.txt -Destination $contextPath
            $env:ARCH_QA_IMAGE = $image
            $env:ARCH_QA_PIN = $pin
            $env:ARCH_QA_CONTEXT = $contextPath
            node -e "const {spawnBounded}=require('./scripts/budget-process.cjs'); spawnBounded('docker',['build','--build-arg','PLAYWRIGHT_VERSION='+process.env.ARCH_QA_PIN,'-t',process.env.ARCH_QA_IMAGE,process.env.ARCH_QA_CONTEXT],{cwd:process.cwd(),env:process.env,timeout:900000}).then(r=>{process.stdout.write(r.stdout);process.stderr.write(r.stderr);process.exitCode=r.status===0?0:1})"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run authoritative RC QA
        run: node scripts/test-arch-container.cjs --profile full-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-budget-evidence
          path: |
            .arch-test-evidence/**/evidence.json
            .arch-test-evidence/**/container-evidence.json
            .arch-test-evidence/**/*.stdout.txt
            .arch-test-evidence/**/*.stderr.txt
          include-hidden-files: true

  # Builds the Tauri shell and launches it on a document: it passes only when the page inside the
  # built binary reports the document's own component and wire counts (tests/desktop_launch_qa.py).
  desktop:
    needs: verify
    runs-on: [self-hosted, ws-arch-cut, Windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact committed source bytes
        run: |
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: native-budget-evidence
          path: verify-evidence
      - name: Prepare checkout-local Python and owned launcher
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:GITHUB_WORKSPACE '.ci-venv/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $launcher = Get-Command pwsh -ErrorAction SilentlyContinue
          if ($launcher) { $launcherPath = $launcher.Source } else { $launcherPath = Join-Path $env:USERPROFILE '.cache/codex-runtimes/codex-primary-runtime/dependencies/native/powershell/pwsh.exe' }
          if (!(Test-Path -LiteralPath $launcherPath)) { throw 'PowerShell 7 is required for owned native processes' }
          & $launcherPath -NoProfile -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { exit 1 }'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 admission failed' }
          (Split-Path -Parent $launcherPath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the page the shell embeds
        run: python build.py
      - name: Check installed Rust toolchain
        run: |
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the desktop shell
        run: cargo build --release --manifest-path desktop/src-tauri/Cargo.toml
      - name: Launch the shell on a document
        run: node scripts/test-arch-supervised.cjs --profile desktop --binary desktop/src-tauri/target/release/sov-schematic-desktop.exe --coverage-evidence verify-evidence
