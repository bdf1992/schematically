name: schematic-ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run authoritative RC QA
        run: python scripts/qa.py
      - name: Stage deployable site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/stage_site.py
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Builds the Tauri shell and launches it on a document: it passes only when the page inside the
  # built binary reports the document's own component and wire counts (tests/desktop_launch_qa.py).
  desktop:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the page the shell embeds
        run: python build.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the desktop shell
        run: cargo build --release --manifest-path desktop/src-tauri/Cargo.toml
      - name: Launch the shell on a document
        run: python tests/desktop_launch_qa.py --binary desktop/src-tauri/target/release/sov-schematic-desktop.exe

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy QA-verified build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
