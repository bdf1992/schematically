name: schematic-ci
# D-0136: a pull request runs only the suites its change touches, under 60 s (python scripts/pr_tests.py);
# a push to dev or main runs the same command against HEAD~1. The whole suite runs on the PC before a
# release (python scripts/release.py vX.Y.Z), and again in release.yml when the tag lands.
on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref replaces the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    # pr_tests.py stops its own run at 60 s; tests/release_path_qa.py holds this job at 45 minutes or more.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Choose the base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR_TESTS_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "PR_TESTS_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi
      - name: Show the selection
        run: python scripts/pr_tests.py --dry-run --base "$PR_TESTS_BASE"
      - name: Install the test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium only when a selected suite opens a page
        run: |
          needs=$(python scripts/pr_tests.py --dry-run --json --base "$PR_TESTS_BASE" | python -c "import json,sys; print(json.load(sys.stdin)['needs_browser'])")
          if [ "$needs" = "True" ]; then python -m playwright install --with-deps chromium; fi
      - name: Run the pull-request tests (60 s)
        run: python scripts/pr_tests.py --base "$PR_TESTS_BASE"
