<script>
// What a viewer shows, read out of a running editor `win` with the document already open: one
// card per component, one arc per passable wire leg exactly as the graph core builds them (a
// control arc is carried with its flag; reach does not follow it, src/07-graph-core.js), and the
// picture in both appearances inside one withPictureLabels (src/75-persistence.js), so the
// drawing at label zoom 1 happens once and the dark picture is the one redraw.
// scripts/export_html.py runs this same function in headless Chromium; a file delivered by
// bin/schematically.mjs runs it here, in the reader's browser. Keep it self-contained.
/*SOV-EXTRACT-BEGIN*/
function sovExtract(win,opts){
  const api=win.SovSchematicAPI,doc=api.file.document(),g=win.SovSchematicGraph.build(doc);
  const nodes=doc.components.map(c=>({id:c.id,label:(c.config&&c.config.label)||c.id,symbolId:c.symbolId||null,
    parentId:c.parentId||null,note:(c.config&&(c.config.note||c.config.description))||null}));
  const wires=doc.wires.map(w=>({id:w.id,a:w.a||null,b:w.b||null,label:(w.config&&w.config.label)||null}));
  const arcs=g.arcs.map(a=>({wire:a.wireId,from:a.from,to:a.to,control:!!a.control}));
  const svg=win.withPictureLabels(()=>{const out={};for(const appearance of ['light','dark']){api.view.setAppearance(appearance);out[appearance]=api.render.svg(opts)}return out});
  return {title:(doc.meta&&doc.meta.title)||doc.id,id:doc.id,nodes,wires,arcs,
    blocked:g.blocked.map(b=>({wire:b.wireId,reason:b.reason})),svg};
}
/*SOV-EXTRACT-END*/
(function(){
'use strict';
const RAW=JSON.parse(document.getElementById('viewer-data').textContent);
const statusEl0=document.getElementById('status');
// A file from export_html.py carries its pictures. One from bin/schematically.mjs carries the
// document and the editor build (gzip, base64), and draws them once here: the editor opens in a
// hidden frame of real size (text measurement needs layout), sovExtract reads it, the frame goes.
async function drawHere(raw){
  statusEl0.textContent='Drawing…';

  $('bPrev').disabled=!tourIds||state.step===0;$('bNext').disabled=!tourIds||state.step>=tourIds.length;
  $('deckCount').textContent=tourIds?`${state.step} / ${tourIds.length}  ·  ← → to move, Esc to leave`:'Esc to leave';
  if(!tourIds){$('deckKicker').textContent=D.title;$('deckTitle').textContent=label(state.focus);$('deckText').textContent=describe(h);return}
  if(!n){$('deckKicker').textContent='Overview';$('deckTitle').textContent=D.title;
    $('deckText').textContent=`${plural(D.nodes.length,'card')} and ${plural(D.wires.length,'wire')}. ${tourIds.length?'Next: '+label(tourIds[0])+'.':''}`;return}
  const to=[...new Set((out.get(n.id)||[]).filter(a=>!a.control).map(a=>label(a.to)))],from=[...new Set((inc.get(n.id)||[]).filter(a=>!a.control).map(a=>label(a.from)))];
  $('deckKicker').textContent=typeName(n.symbolId)+(n.parentId?' · inside '+label(n.parentId):'');
  $('deckTitle').textContent=n.label;
  $('deckText').textContent=[n.note,from.length?'Fed by '+from.join(', ')+'.':'',to.length?'Leads to '+to.join(', ')+'.':''].filter(Boolean).join(' ');
}

function writeHash(){
  const p=new URLSearchParams();
  if(state.focus&&!(state.present&&tourIds))p.set('focus',state.focus);
  if(state.mode&&!state.picking)p.set('mode',state.mode);
  if(state.to)p.set('to',state.to);
  if(state.lens.length)p.set('lens',state.lens.join('~'));
  if(state.style!=='clean')p.set('style',state.style);
  if(state.theme!=='system')p.set('theme',state.theme);
  if(state.present)p.set('present','1');
  const h=p.toString().replace(/%7E/g,'~');
  if(location.hash.slice(1)!==h)history.replaceState(null,'',h?'#'+h:location.pathname+location.search);
}
function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  const theme=p.get('theme');state.theme=['light','dark'].includes(theme)?theme:'system';
  const style=p.get('style');state.style=isStyle(style)?style:'clean';
  const f=p.get('focus');state.focus=nodes.has(f)?f:null;
  const m=p.get('mode');state.mode=state.focus&&['down','up','route'].includes(m)?m:null;
  const t=p.get('to');state.to=state.mode==='route'&&nodes.has(t)?t:null;
  if(state.mode==='route'&&!state.to)state.mode=null;
  state.lens=(p.get('lens')||'').split('~').filter(x=>types.some(y=>y[0]===x)).slice(0,2);
  state.picking=false;
  return p.get('present')==='1';
}

function find(q){
  q=q.trim().toLowerCase();if(!q)return null;
  const all=D.nodes;
  return (all.find(n=>n.label.toLowerCase()===q||n.id.toLowerCase()===q)||all.find(n=>n.label.toLowerCase().startsWith(q))||all.find(n=>n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q))||{}).id||null;
}

// ---- pictures out: the svg with the rules that style it, drawn onto a canvas.
const fileBase=()=>(D.source||D.id||'schematic').replace(/\.sov$/,'');
function pictureImage(vb,w,h){
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);clone.setAttribute('width',w);clone.setAttribute('height',h);
  const css=[...document.styleSheets[0].cssRules].filter(r=>r.selectorText&&r.selectorText.includes('svg.pic')).map(r=>r.cssText).join('\n');
  const st=document.createElementNS('http://www.w3.org/2000/svg','style');st.textContent=css;clone.insertBefore(st,clone.firstChild);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=rej;img.src=url});
}
function download(canvas,name){canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
async function savePng(){
  const r=stage.getBoundingClientRect(),scale=2,img=await pictureImage(view,r.width,r.height);
  const c=document.createElement('canvas');c.width=r.width*scale;c.height=r.height*scale;const x=c.getContext('2d');
  x.fillStyle=getComputedStyle(stage).backgroundColor;x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  download(c,fileBase()+(state.focus?'-'+state.focus:'')+'.png');
}
// A share card is 1200×630: what was traced, in words, over the drawing with the trace lit. The
// whole drawing stays as context unless that would shrink the trace past reading.
async function shareCard(){
  const h=highlight();if(!state.focus||!state.mode||!h||h.none||!h.nodes.length)return null;
  const W=1200,H=630,S=2,cs=getComputedStyle(root),ink=cs.getPropertyValue('--ink').trim(),muted=cs.getPropertyValue('--muted').trim();
  const area={x:48,y:168,w:W-96,h:H-168-56};
  const traced=boxOf([state.focus,...h.nodes]);
  const box=Math.min(area.w/home.w,area.h/home.h)>=0.42?home:traced;
  const k=Math.max(box.w/area.w,box.h/area.h),vb={x:box.x+box.w/2-area.w*k/2,y:box.y+box.h/2-area.h*k/2,w:area.w*k,h:area.h*k};
  const img=await pictureImage(vb,area.w,area.h);
  const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
  x.fillStyle=getComputedStyle(stage).backgroundColor;x.fillRect(0,0,W,H);
  x.drawImage(img,area.x,area.y,area.w,area.h);
  const font=getComputedStyle(document.body).fontFamily;
  const kind=state.mode==='route'?'Route':state.mode==='down'?'Downstream reach':'Upstream reach';
  const f=label(state.focus);
  const head=state.mode==='route'?h.nodes.map(label).join(' → '):state.mode==='down'?`${f} reaches ${plural(h.nodes.length,'card')}`:`${plural(h.nodes.length,'card')} reach ${f}`;
  const sub=`${plural(h.wires.length,'wire')} · authored relationships in ${D.source||D.id}`;
  x.fillStyle=muted;x.font=`600 13px ${font}`;x.fillText((kind+'  ·  '+D.title).toUpperCase().slice(0,110),48,56);
  x.fillStyle=ink;x.font=`600 32px ${font}`;
  let line=head;while(x.measureText(line).width>W-96&&line.length>4)line=line.slice(0,-2);if(line!==head)line=line.replace(/.$/,'…');
  x.fillText(line,48,100);
  x.fillStyle=muted;x.font=`400 16px ${font}`;x.fillText(sub,48,130);
  x.font=`600 13px ${font}`;x.textAlign='right';x.fillText('Schematically',W-48,H-24);
  download(c,`${fileBase()}-${state.mode==='route'?'route':'reach'}-card.png`);
  return c;
}

// ---- menus
const MENUS={bStyle:'menuStyle',bShare:'menuShare',bLens:'menuLens',bHelp:'menuHelp'};
function closeMenus(except){for(const [b,m] of Object.entries(MENUS))if(m!==except){$(m).hidden=true;$(b).setAttribute('aria-expanded','false')}}
function toggleMenu(b){
  const m=$(MENUS[b]),open=m.hidden;closeMenus();if(!open)return;
  m.hidden=false;$(b).setAttribute('aria-expanded','true');
  const r=$(b).getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
  const left=Math.min(Math.max(8,r.right-mw),innerWidth-mw-8),below=r.bottom+6+mh<innerHeight;
  m.style.left=left+'px';m.style.top=(below?r.bottom+6:r.top-6-mh)+'px';
  const first=m.querySelector('button:not(:disabled)');if(first)first.focus();
}
// A menu follows the menu-button pattern: arrows move between its items, Esc closes it and gives
// focus back to its button, Tab or a click elsewhere closes it.
for(const [b,id] of Object.entries(MENUS))$(id).addEventListener('keydown',e=>{
  const items=[...$(id).querySelectorAll('button:not(:disabled)')],i=items.indexOf(document.activeElement);
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();items[(i+1)%items.length]?.focus()}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();items[(i-1+items.length)%items.length]?.focus()}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMenus();$(b).focus()}
  else if(e.key==='Tab'){closeMenus();$(b).focus()}
  e.stopPropagation();
});

// ---- wiring
let drag=null;
stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;closeMenus();cancelAnimationFrame(anim);drag={x:e.clientX,y:e.clientY,v:{...view},moved:false};stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;stage.classList.add('panning');
  const r=stage.getBoundingClientRect(),s=Math.max(drag.v.w/r.width,drag.v.h/r.height);setView({...drag.v,x:drag.v.x-dx*s,y:drag.v.y-dy*s})});
stage.addEventListener('pointerup',e=>{const d=drag;drag=null;stage.classList.remove('panning');if(!d||d.moved)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),g=el&&el.closest('g.node[data-id]');if(g)select(g.dataset.id);else if(!state.picking&&!state.present)clear()});
stage.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0015))},{passive:false});
stage.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('g.node[data-id]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();select(g.dataset.id)}});
let mapDrag=false;
const mapTo=e=>{const r=mapEl.getBoundingClientRect(),sc=Math.min(r.width/home.w,r.height/home.h),ox=(r.width-home.w*sc)/2,oy=(r.height-home.h*sc)/2;
  const px=home.x+(e.clientX-r.left-ox)/sc,py=home.y+(e.clientY-r.top-oy)/sc;setView({...view,x:px-view.w/2,y:py-view.h/2})};
mapEl.addEventListener('pointerdown',e=>{mapDrag=true;mapEl.setPointerCapture(e.pointerId);cancelAnimationFrame(anim);mapTo(e)});
mapEl.addEventListener('pointermove',e=>{if(mapDrag)mapTo(e)});
mapEl.addEventListener('pointerup',()=>{mapDrag=false});
panel.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){select(a.dataset.go);centerOn(a.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='clear')clear();else if(act==='center')centerOn(state.focus);else setMode(act)});
$('bDown').onclick=()=>setMode('down');$('bUp').onclick=()=>setMode('up');$('bRoute').onclick=()=>setMode('route');
$('bFit').onclick=fit;
$('bIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.8)};
$('bOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25)};
$('bTheme').onclick=()=>setTheme({system:'light',light:'dark',dark:'system'}[state.theme]);
for(const b of Object.keys(MENUS))$(b).onclick=e=>{e.stopPropagation();toggleMenu(b)};
$('menuStyle').onclick=e=>{const b=e.target.closest('[data-style]');if(b){setStyle(b.dataset.style);closeMenus()}};
$('lensChips').onclick=e=>{const b=e.target.closest('[data-type]');if(b){if(state.focus)clear();toggleLensType(b.dataset.type)}};
$('bMap').onclick=()=>setMap(!state.map);
$('bPresent').onclick=()=>present(true);$('bExit').onclick=()=>present(false);
$('bPrev').onclick=()=>goStep(state.step-1);$('bNext').onclick=()=>goStep(state.step+1);
$('bPng').onclick=()=>{closeMenus();savePng()};$('bPrint').onclick=()=>{closeMenus();print()};
$('bCardRoute').onclick=$('bCardReach').onclick=()=>{closeMenus();shareCard()};
$('bLink').onclick=()=>{closeMenus();const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{statusEl.textContent='Link copied.'},()=>prompt('Link to this view',u))};
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenus()});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const id=find(search.value);if(id){select(id);centerOn(id);search.blur()}else statusEl.textContent=`No card matches “${search.value}”.`}
  if(e.key==='Escape'){search.value='';search.blur()}});
document.addEventListener('keydown',e=>{
  if(e.target===search||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(state.present){
    if(k==='Escape')present(false);
    else if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();goStep(state.step+1)}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();goStep(state.step-1)}
    else if(k==='Home')goStep(0);else if(k==='End'&&tourIds)goStep(tourIds.length);
    return;
  }
  if(k==='/'){e.preventDefault();search.focus();search.select()}
  else if(k==='Escape'){if(document.querySelector('.menu:not([hidden])'))closeMenus();else if(state.focus)clear();else if(state.lens.length)setLens([])}
  else if(k==='d')setMode('down');else if(k==='u')setMode('up');else if(k==='r')setMode('route');
  else if(k==='t')$('bTheme').click();else if(k==='f'||k==='0')fit();
  else if(k==='s'){const ks=Object.keys(STYLES);setStyle(ks[(ks.indexOf(state.style)+1)%ks.length])}
  else if(k==='l')toggleMenu('bLens');else if(k==='m')setMap(!state.map);else if(k==='p')present(true);
  else if(k==='+'||k==='=')$('bIn').click();else if(k==='-')$('bOut').click();
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&enteredFullscreen&&state.present){enteredFullscreen=false;present(false)}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')mount()});
addEventListener('hashchange',()=>{const p=readHash();mount();if(p!==state.present)present(p);else if(state.present&&tourIds)goStep(state.step)});
addEventListener('resize',()=>{if(!svg)return;placeStatus();const old=size;size=stageSize();
  const k=view.w/old.w,cx=view.x+view.w/2,cy=view.y+view.h/2;setView({x:cx-size.w*k/2,y:cy-size.h*k/2,w:size.w*k,h:size.h*k})});

document.title=D.title;$('title').textContent=D.title;$('title').title=D.title;
$('cards').innerHTML=D.nodes.map(n=>`<option value="${esc(n.label)}">${esc(n.id)}</option>`).join('');
const presentAtOpen=readHash();mount();
if(presentAtOpen)present(true);
window.SovViewer={data:D,state,downstream,upstream,route,select,setMode,clear,setTheme,setStyle,setLens,setMap,find,fit,present,goStep,tour,shareCard,lensSet};
}
})();
